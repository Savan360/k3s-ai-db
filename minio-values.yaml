auth:
  rootUser: "minioadmin"
  rootPassword: "MinioPass321"

# Указываем чарту использовать образы из легаси-репозитория
image:
  registry: docker.io
  repository: bitnamilegacy/minio
  tag: latest # или укажите конкретную версию, например 2025.7.23-debian-12-r5

console:
  image:
    registry: docker.io
    repository: bitnamilegacy/minio-object-browser # или minio-console, в зависимости от версии чарта
    tag: latest

# Разрешаем чарту использовать образы из нестандартного репозитория
global:
  security:
    allowInsecureImages: true

persistence:
  enabled: true
  size: 10Gi
